kind: MCPTools
apiVersion: api.ibm.com/v1
metadata:
  name: mcp1-tool-ifrsh
  namespace: mcp1
  version: 1.0.0
  tags: []
  domain: mcp
  labels: {}
spec:
  tools:
    - name: ask_question
      title: ask_question
      description: Ask any question about a GitHub repository and get an AI-powered,
        context-grounded response.
      inputSchema:
        properties:
          repoName:
            anyOf:
              - type: string
              - items:
                  type: string
                type: array
            description: GitHub repository or list of repositories (max 10) in owner/repo
              format.
          question:
            description: The question to ask about the repository.
            type: string
        required:
          - repoName
          - question
        type: object
    - name: read_wiki_contents
      title: read_wiki_contents
      description: View documentation about a GitHub repository.
      inputSchema:
        properties:
          repoName:
            description: GitHub repository in owner/repo format (e.g. "facebook/react").
            type: string
        required:
          - repoName
        type: object
    - name: read_wiki_structure
      title: read_wiki_structure
      description: Get a list of documentation topics for a GitHub repository.
      inputSchema:
        properties:
          repoName:
            description: GitHub repository in owner/repo format (e.g. "facebook/react").
            type: string
        required:
          - repoName
        type: object
